# 工程内固定的开发签名。
#
# 这份 keystore **有意入库**：Android 的 debug 签名默认取自每台机器各自的
# ~/.android/debug.keystore，两台机器编出来的同一个 App 签名不同，装到
# 同一台设备上就会因为「签名不一致」被系统拒绝，只能先卸载——而卸载会
# 带走笔记，装回来还得重新授权。签名固定在工程里，换机器、换设备都能
# 直接覆盖安装。
#
# 这是**开发用**签名，不是发布签名：口令是公开的，任何人都能用它签出
# 一个冒充本应用的包。真要上架，必须换成自己保管的发布密钥，并且不要
# 提交进版本库。
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=keystore/jotit-dev.keystore

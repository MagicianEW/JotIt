# 工程内固定的**开发**签名。
#
# 这份 keystore **有意入库**：Android 的 debug 签名默认取自每台机器各自的
# ~/.android/debug.keystore，两台机器编出来的同一个 App 签名不同，装到
# 同一台设备上就会因为「签名不一致」被系统拒绝，只能先卸载——而卸载会
# 带走笔记，装回来还得重新授权。签名固定在工程里，换机器、换设备都能
# 直接覆盖安装。
#
# 口令是公开的（`android` / `android`），任何人拿到这份文件都能签出一个
# 冒充本应用的包。所以它**只配给 debug 构建**。
#
# 要发布，请准备一份自己的密钥放在 `android/key-release.properties`
# （那份不入库，见 .gitignore），构建脚本会自动优先用它。没有它时 release
# 构建会退回这把开发密钥并打印警告——能装能用，但**不能拿去上架**：
# 密钥公开，意味着任何人都能签出一个「更新」装到用户手机上。
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=keystore/jotit-dev.keystore
